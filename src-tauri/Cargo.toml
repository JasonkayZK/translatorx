[package]
name = "translatorx"
version = "1.0.3"
description = "TranslatorX: write in your native language, then write it yourself in the language you are learning."
authors = ["TranslatorX"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "translatorx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
# "socks" lets the proxy setting take socks5:// URLs as well as http://.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
chrono = "0.4"
base64 = "0.22"
png = "0.17"
thiserror = "2"

# Accessibility, pasteboard and key events for the input-box bubble and auto-insert.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString", "NSObject", "NSLocale"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "NSApplication",
    "NSAppearance",
    "NSPanel",
    "NSResponder",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSRunningApplication",
    "NSSavePanel",
    "NSWindow",
    "NSWorkspace",
] }

# UI Automation (the focused input and its frame), process names, foreground activation,
# Ctrl+V and clipboard sequence numbers for the input-box bubble and auto-insert.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
